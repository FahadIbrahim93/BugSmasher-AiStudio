name: Security Audit

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  schedule:
    - cron: '30 6 * * 1'

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Audit root dependencies
        # Production tree only — firebase-tools/dev tooling stays waived (S-09).
        run: npm audit --omit=dev
      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci
      - name: Audit Functions dependencies
        working-directory: functions
        # Fail only on high/critical; 10 low/moderate firebase-admin transitives waived.
        run: npm audit --omit=dev --audit-level=high
