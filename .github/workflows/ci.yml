name: CI

on:
  push:
    branches: [main, develop, 'feat/**', 'fix/**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc — hard gate)
        run: npm run typecheck

      # ESLint debt is tracked as a known-open gate (see AGENTS.md). Keep it visible
      # and running on every push, but advisory so it cannot block deploys.
      - name: Lint (eslint — advisory, tracked debt)
        run: npm run lint:eslint
        continue-on-error: true

      - name: Typecheck Functions (Cloud Functions for server validation)
        run: |
          if [ -f functions/package.json ]; then
            cd functions
            npm ci
            npm run build
          else
            echo "No functions to build"
          fi

      - name: Unit tests (with coverage per audit)
        run: npm run test:coverage

      - name: Setup Java (Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Firebase emulator security tests
        run: npm run test:emulator
        env:
          CHECKSUM_SALT: ci-test-salt-not-for-production

      # Same public Firebase web config as deploy-preview: keeps the uploaded
      # dist artifact fully-configured and deterministic for any manual redeploy.
      - name: Production build
        env:
          VITE_FIREBASE_API_KEY: AIzaSyAgszp_gKNxJCUs0BWa42pArAzyHSuzDqw
          VITE_FIREBASE_AUTH_DOMAIN: studio-1155838266-56095.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: studio-1155838266-56095
          VITE_FIREBASE_APP_ID: 1:911343381703:web:75c16ea460d4aeab2ca2e2
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  e2e:
    name: Playwright E2E (built app)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        # --with-deps installs the OS libraries Chromium needs on the runner
        run: npx playwright install --with-deps chromium

      - name: Download build artifact (same dist the quality job validated)
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Run E2E tests (vite preview serves the artifact)
        # Runs playwright directly (not `npm run test:e2e`) so the env-baked CI
        # build artifact is tested as-is instead of being rebuilt without envs.
        run: npx playwright test

  deploy-preview:
    name: Deploy Preview (PRs) + Live (main)
    needs: quality
    if: (github.event_name == 'pull_request') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    # Map the deploy secret to a job-level env var: GitHub Actions does not allow
    # referencing secrets directly inside `if:` conditionals, so the step checks env.
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install & build
        # Public Firebase web config (same values already shipped in the client
        # bundle) baked into CI builds so the Firebase mirror and any artifact
        # deploy get the fully-configured dist deterministically — no dashboard
        # env setup required. NOTE: Vercel builds on its own infra; it still
        # needs these in the Vercel dashboard env vars (Production scope).
        env:
          VITE_FIREBASE_API_KEY: AIzaSyAgszp_gKNxJCUs0BWa42pArAzyHSuzDqw
          VITE_FIREBASE_AUTH_DOMAIN: studio-1155838266-56095.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: studio-1155838266-56095
          VITE_FIREBASE_APP_ID: 1:911343381703:web:75c16ea460d4aeab2ca2e2
        run: |
          npm ci
          npm run build

      # Primary hosting is Vercel (currently serves the latest build; push-to-deploy
      # integration not yet confirmed). The Firebase deploy is a secondary mirror;
      # skip it cleanly until FIREBASE_SERVICE_ACCOUNT is configured (previously it
      # crashed here, hidden by continue-on-error, leaving Firebase stale).
      - name: Deploy to Firebase Hosting (preview channel for PRs, live for main)
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'live' }}
          projectId: studio-1155838266-56095
